<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SFP Control Tower · IDB Sub-Sovereign Finance Program</title>
<style>
  /* IDB-aligned identity (approximate palette per iadb.org; verify before external use) */
  :root{
    --bg:#F4F7F8; --panel:#FFFFFF; --panel2:#FAFCFC; --line:#DCE4E7;
    --ink:#0B2B3C; --ink2:#13334A; --muted:#5B6B72;
    --cyan:#00A0AF; --cyan-b:#00B9C7; --cyan-d:#007A86; --cyan-bg:#E5F5F7;
    --green:#3DA66E; --amber:#E8A33D; --red:#D2544E;
    --chip:#ECF2F4; --shadow:0 1px 3px rgba(11,43,60,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px}
  /* header */
  header{display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--panel);border-bottom:1px solid var(--line);border-top:4px solid var(--cyan)}
  .idb-mark{width:42px;height:42px;border-radius:6px;background:var(--cyan);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.5px}
  header h1{font-size:16.5px;margin:0;font-weight:700;color:var(--ink)}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px}
  header .spacer{flex:1}
  header .brandtag{color:var(--muted);font-size:11px;text-align:right;line-height:1.5}
  header .brandtag b{color:var(--cyan-d)}
  /* nav */
  nav{display:flex;gap:4px;padding:0 26px;background:var(--panel);border-bottom:1px solid var(--line)}
  nav button{background:none;border:none;color:var(--muted);padding:13px 16px;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600}
  nav button.active{color:var(--ink);border-bottom-color:var(--cyan)}
  nav button:hover{color:var(--ink)}
  main{padding:24px 26px;max-width:1320px;margin:0 auto}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px;box-shadow:var(--shadow)}
  .kpi .v{font-size:23px;font-weight:750;color:var(--ink2)}
  .kpi .l{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.3}
  .section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:var(--cyan-d);font-weight:700;margin:8px 0 6px}
  .section-sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.5;max-width:880px}
  /* toolbar */
  .controls{display:flex;gap:10px;margin:12px 0 14px;flex-wrap:wrap;align-items:center}
  select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:7px 10px;font-size:13px}
  .btn{background:var(--cyan);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:650;cursor:pointer}
  .btn:hover{background:var(--cyan-d)}
  .btn.ghost{background:var(--panel);color:var(--cyan-d);border:1px solid var(--cyan)}
  .checklabel{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
  /* pipeline board */
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:140px}
  .col h3{font-size:12.5px;margin:2px 2px 1px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
  .col h3 .n{background:var(--chip);border-radius:20px;padding:1px 8px;font-size:11px}
  .col .roll{color:var(--muted);font-size:11px;margin:0 2px 4px}
  .col .gate{color:var(--cyan-d);background:var(--cyan-bg);border-radius:6px;font-size:10.5px;line-height:1.35;padding:5px 7px;margin:0 0 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:9px;cursor:pointer;transition:.12s;box-shadow:var(--shadow)}
  .card:hover{border-color:var(--cyan);transform:translateY(-1px)}
  .card .nm{font-weight:650;font-size:13px;display:flex;align-items:center;gap:6px}
  .card .meta{color:var(--muted);font-size:11px;margin-top:3px;display:flex;justify-content:space-between;gap:6px}
  .card .chips{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center}
  .chip{font-size:10px;font-weight:650;border-radius:4px;padding:1.5px 6px;background:var(--chip);color:var(--muted)}
  .chip.warn{background:#FBF1DC;color:#9A6B14}
  .chip.bad{background:#F9E5E3;color:#A33730}
  .chip.good{background:#E2F2E9;color:#2A7A4F}
  .stagebtns{margin-left:auto;display:flex;gap:3px}
  .stagebtns button{border:1px solid var(--line);background:var(--panel);border-radius:5px;color:var(--muted);font-size:11px;cursor:pointer;padding:1px 6px}
  .stagebtns button:hover{color:var(--cyan-d);border-color:var(--cyan)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .t-Ready{color:var(--green)} .bg-Ready{background:var(--green)}
  .t-Developing{color:var(--amber)} .bg-Developing{background:var(--amber)}
  .t-Early{color:var(--red)} .bg-Early{background:var(--red)}
  /* table */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;background:var(--panel2)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--cyan-bg)}
  .bar{height:7px;border-radius:5px;background:var(--chip);overflow:hidden;min-width:70px}
  .bar > i{display:block;height:100%}
  .pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:650}
  .badge{display:inline-block;font-size:10px;font-weight:650;border-radius:4px;padding:1.5px 6px;background:var(--chip);color:var(--muted);margin-left:6px}
  .badge.real{background:var(--cyan-bg);color:var(--cyan-d)}
  /* weights panel */
  .weights{display:flex;gap:22px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;align-items:center;box-shadow:var(--shadow)}
  .weights .w{display:flex;flex-direction:column;gap:3px;min-width:170px}
  .weights label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
  .weights label b{color:var(--cyan-d)}
  .weights input[type=range]{accent-color:var(--cyan);width:100%}
  /* M&E */
  .me-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .me-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px;box-shadow:var(--shadow)}
  .me-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .me-card .name{font-weight:650;font-size:13px}
  .me-card .nums{font-size:13px;color:var(--muted)}
  .me-card .nums b{color:var(--ink2);font-size:17px}
  .me-card .ms{color:var(--muted);font-size:11px;margin-top:8px}
  .me-card .gap{font-size:11.5px;margin-top:6px;color:#9A6B14;background:#FBF1DC;border-radius:6px;padding:4px 8px;display:inline-block}
  .status{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .s-on-track{background:#E2F2E9;color:var(--green)}
  .s-at-risk{background:#FBF1DC;color:#9A6B14}
  .s-off-track{background:#F9E5E3;color:var(--red)}
  .obj{margin:20px 0 10px;padding:10px 14px;background:var(--cyan-bg);border-left:3px solid var(--cyan);border-radius:0 8px 8px 0}
  .obj .ot{font-weight:700;font-size:13px;color:var(--ink2)}
  .obj .od{font-size:11.5px;color:var(--muted);margin-top:2px}
  .timeline{display:flex;gap:0;margin:18px 0 8px;position:relative}
  .ms-node{flex:1;text-align:center;position:relative;padding-top:24px}
  .ms-node:before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
  .ms-node .pt{position:absolute;top:1px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:var(--panel);border:3px solid var(--cyan);box-shadow:0 0 0 4px var(--bg)}
  .ms-node.past .pt{background:var(--cyan)}
  .ms-node .d{font-size:11px;color:var(--muted)}
  .ms-node .ti{font-size:12.5px;font-weight:650;margin-top:2px}
  .ms-node .ds{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35;padding:0 8px}
  .evalnote{color:var(--muted);font-size:11.5px;margin:0 0 22px;text-align:center}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 20px}
  .panelcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
  .panelcard h4{margin:0 0 4px;font-size:13px;color:var(--ink2)}
  .panelcard .hint{color:var(--muted);font-size:11.5px;margin-bottom:10px}
  .hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
  .hbar .lab{width:150px;color:var(--muted);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar .val{width:70px;text-align:right;color:var(--ink2);font-weight:600;flex:none}
  /* drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(11,43,60,.45);display:none;z-index:30}
  .drawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:94vw;background:var(--panel);border-left:1px solid var(--line);padding:22px;overflow:auto;transform:translateX(100%);transition:.18s;z-index:31}
  .drawer.open{transform:none}
  .drawer h2{margin:0 0 2px;font-size:19px;color:var(--ink2)}
  .drawer .x{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--muted);font-size:20px}
  .drawer .sechead{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--cyan-d);font-weight:700;margin:20px 0 8px;border-top:1px solid var(--line);padding-top:14px}
  .scorewheel{display:flex;align-items:center;gap:16px;margin:14px 0 10px}
  .scorewheel .big{font-size:42px;font-weight:800;line-height:1}
  .subrow{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:8px}
  .subrow .lab{font-size:12px;width:118px;color:var(--muted);flex:none}
  .subrow .pts{width:92px;text-align:right;font-size:11.5px;color:var(--muted);flex:none}
  .subrow .pts b{color:var(--ink2)}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .kv .k{color:var(--muted);font-size:11px}
  .kv .val{font-size:13px;font-weight:600}
  .elig div{font-size:12.5px;margin:5px 0}
  .check{font-size:12.5px;margin:5px 0;display:flex;gap:7px;align-items:baseline}
  .procstrip{display:flex;gap:4px;margin:10px 0 4px}
  .procstrip .st{flex:1;text-align:center;font-size:9.5px;color:var(--muted);border-top:4px solid var(--chip);padding-top:4px;line-height:1.25}
  .procstrip .st.done{border-top-color:var(--cyan-b)}
  .procstrip .st.cur{border-top-color:var(--cyan);color:var(--ink2);font-weight:700}
  .footnote{color:var(--muted);font-size:11px;margin-top:24px;line-height:1.55;border-top:1px solid var(--line);padding-top:12px}
  .ok{color:var(--green)} .no{color:var(--red)}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(11,43,60,.45);display:none;z-index:40;align-items:center;justify-content:center}
  .modal{background:var(--panel);border-radius:12px;padding:22px 24px;width:560px;max-width:94vw;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(11,43,60,.25)}
  .modal h3{margin:0 0 2px;font-size:16px;color:var(--ink2)}
  .modal .hint{color:var(--muted);font-size:12px;margin-bottom:14px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .fgrid .full{grid-column:1/-1}
  .fgrid label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
  .fgrid input,.fgrid select{width:100%}
  .rrow{display:flex;align-items:center;gap:8px}
  .rrow input[type=range]{flex:1;accent-color:var(--cyan)}
  .rrow output{width:30px;text-align:right;font-size:12.5px;font-weight:650;color:var(--ink2)}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
</style>
</head>
<body>
<header>
  <div class="idb-mark">IDB</div>
  <div>
    <h1>Sub-Sovereign Finance Program (SFP) · Control Tower</h1>
    <div class="sub">Inter-American Development Bank — 5-year pilot · lending to SNGs without sovereign guarantee · 63 candidates · 8 countries</div>
  </div>
  <div class="spacer"></div>
  <div class="brandtag">Data trust layer powered by <b>OpenEarth · CityCatalyst</b><br/>Demo build — all figures fictional unless marked</div>
</header>
<nav>
  <button data-tab="pipeline" class="active">Intake &amp; Triage</button>
  <button data-tab="readiness">Readiness Scoring</button>
  <button data-tab="me">M&amp;E &amp; Board</button>
</nav>
<main>
  <div class="kpis" id="kpis"></div>
  <div id="tab-pipeline"></div>
  <div id="tab-readiness" style="display:none"></div>
  <div id="tab-me" style="display:none"></div>
</main>

<div class="drawer-bg" id="drawerBg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script src="data/sngs.js"></script>
<script src="scoring.js"></script>
<script>
const DATA = window.CONTROL_TOWER_DATA;
const SM = window.ScoringModel;
// re-score from the shared model so the dashboard proves the pipeline is live
DATA.sngs = DATA.sngs.map(s => SM.scoreSNG(s));
// deterministic "today" for the demo = dataset generation date
const TODAY = new Date(DATA.generated + "T12:00:00");

const STAGES = ["Intake","Screening","Readiness Review","Structuring","Board Pipeline"];
// the IDB SFP review instances each stage maps to (proposal doc, fn.59 + §4.17)
const STAGE_META = {
  "Intake":           "Proposal received · documentary intake (legal, fiscal, audit, non-accrual)",
  "Screening":        "Gate 1 — early SNG eligibility: legal capacity, credit risk, integrity, expected impact",
  "Readiness Review": "Early creditworthiness assessment · readiness tiering (CityCatalyst signals)",
  "Structuring":      "Gate 2 — quality &amp; risk review: credit rating, additionality, fiduciary &amp; safeguards",
  "Board Pipeline":   "Board approval under SG procedures (GN-1838-3)",
};
const ISO = {Brazil:"BR",Mexico:"MX",Colombia:"CO",Argentina:"AR",Peru:"PE",Chile:"CL",Ecuador:"EC","Dominican Republic":"DO"};

const fmt = n => n.toLocaleString();
const fv = (v,suf="") => (v===null||v===undefined) ? "—" : v + suf;
const tierColor = t => ({Ready:"var(--green)",Developing:"var(--amber)",Early:"var(--red)"}[t]);
const barColor = v => v>=70?"var(--green)":v>=45?"var(--amber)":"var(--red)";
const daysIn = s => Math.max(0, Math.round((TODAY - new Date(s.proposal.submitted))/86400000));
const askSum = arr => arr.reduce((a,b)=>a+b.proposal.askUSDm,0);

function renderAll(){ renderKPIs(); renderPipeline(); renderReadiness(false); renderME(); }

/* ---------- KPIs ---------- */
function renderKPIs(){
  const s=DATA.sngs;
  const ready=s.filter(x=>x.tier==="Ready").length;
  const pipe=s.filter(x=>["Structuring","Board Pipeline"].includes(x.proposal.stage)).length;
  const committed=askSum(s.filter(x=>x.proposal.stage==="Board Pipeline"));
  const avg=Math.round(s.reduce((a,b)=>a+b.compositeReadiness,0)/s.length);
  const noGuarantee=s.filter(x=>x.signals.canBorrowWithoutSovereignGuarantee).length;
  const k=[
    [s.length,"Candidate SNGs screened"],
    [ready,"Ready tier (early creditworthiness)"],
    [pipe,"In structuring / Board pipeline"],
    ["$"+committed.toFixed(0)+"M","Indicative committed · of US$1B Subprogram 1"],
    [avg+" pts","Avg composite readiness"],
    [noGuarantee,"Can borrow w/o sovereign guarantee"],
  ];
  document.getElementById("kpis").innerHTML=k.map(([v,l])=>
    `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
}

/* ---------- Pipeline (intake & triage — stage-gate tracker) ---------- */
let pCountry="all", pTier="all", pIssues=false;
function renderPipeline(){
  const visible=DATA.sngs.filter(s=>
    (pCountry==="all"||s.country===pCountry)&&
    (pTier==="all"||s.tier===pTier)&&
    (!pIssues||!s.eligibility.eligible||SM.intakeChecklist(s).some(c=>!c.done)));
  const byStage=Object.fromEntries(STAGES.map(s=>[s,[]]));
  visible.forEach(s=>byStage[s.proposal.stage].push(s));
  const countries=["all",...[...new Set(DATA.sngs.map(s=>s.country))].sort()];
  const cols=STAGES.map((st,i)=>{
    const items=byStage[st].sort((a,b)=>daysIn(b)-daysIn(a));
    const cards=items.map(s=>{
      const d=daysIn(s);
      const cl=SM.intakeChecklist(s); const done=cl.filter(c=>c.done).length;
      const age=d>120?"bad":d>60?"warn":"";
      return `
      <div class="card" onclick="openDrawer('${s.id}')">
        <div class="nm"><span class="dot bg-${s.tier}" title="${s.tier} · ${s.compositeReadiness} pts"></span>${s.name}</div>
        <div class="meta"><span>${s.country} · ${s.type}</span><span>$${s.proposal.askUSDm}M</span></div>
        <div class="meta"><span>${s.proposal.title}</span></div>
        <div class="chips">
          <span class="chip ${age}" title="Days since submission">${d}d</span>
          <span class="chip ${done<cl.length?"warn":"good"}" title="Documentary checklist">docs ${done}/${cl.length}</span>
          ${s.eligibility.eligible?"":'<span class="chip bad" title="Fails an IDB project-eligibility criterion">not eligible</span>'}
          ${s.signals.independentAudit?"":'<span class="chip warn">no audit</span>'}
          <span class="stagebtns">
            ${i>0?`<button onclick="moveStage(event,'${s.id}',-1)" title="Send back a stage">◂</button>`:""}
            ${i<STAGES.length-1?`<button onclick="moveStage(event,'${s.id}',1)" title="Advance a stage">▸</button>`:""}
          </span>
        </div>
      </div>`;}).join("");
    return `<div class="col">
      <h3>${st}<span class="n">${items.length}</span></h3>
      <div class="roll">$${askSum(items).toFixed(0)}M asked</div>
      <div class="gate">${STAGE_META[st]}</div>${cards}</div>`;
  }).join("");
  document.getElementById("tab-pipeline").innerHTML=`
    <div class="section-title">Proposal pipeline — stage-gate tracker</div>
    <p class="section-sub">Workflow view: where each proposal sits in the SFP process, how long it has waited, and what documentation
    is missing before the next review gate. For the analytic question — <i>is this SNG actually ready?</i> — open a card or switch
    to <b>Readiness Scoring</b>: both views read the same live candidate record.</p>
    <div class="controls">
      <button class="btn" onclick="openIntakeForm()">+ New proposal</button>
      <select onchange="pCountry=this.value;renderPipeline()">${countries.map(c=>`<option value="${c}" ${c===pCountry?"selected":""}>${c==="all"?"All countries":c}</option>`).join("")}</select>
      <select onchange="pTier=this.value;renderPipeline()">${["all","Ready","Developing","Early"].map(t=>`<option value="${t}" ${t===pTier?"selected":""}>${t==="all"?"All tiers":t}</option>`).join("")}</select>
      <label class="checklabel"><input type="checkbox" ${pIssues?"checked":""} onchange="pIssues=this.checked;renderPipeline()"/>issues only</label>
      <div style="flex:1"></div>
      <div style="color:var(--muted);font-size:12px">${visible.length} proposals · $${askSum(visible).toFixed(0)}M total ask</div>
    </div>
    <div class="board">${cols}</div>`;
}
function moveStage(ev,id,dir){
  ev.stopPropagation();
  const s=DATA.sngs.find(x=>x.id===id); if(!s)return;
  const i=STAGES.indexOf(s.proposal.stage)+dir;
  if(i<0||i>=STAGES.length)return;
  s.proposal.stage=STAGES[i];
  Object.assign(s, SM.scoreSNG(s)); // checklist "crowding-out screen" flips at intake exit
  renderAll();
}

/* ---------- Readiness scoring (early creditworthiness assessment) ---------- */
let sortKey="compositeReadiness", sortDir=-1, filterCountry="all", filterTier="all";
function rescore(skipWeights){ DATA.sngs=DATA.sngs.map(s=>SM.scoreSNG(s)); renderKPIs(); renderPipeline(); renderReadiness(skipWeights); renderME(); }
let activeWeightKey=null;
function onWeightInput(k,v){ activeWeightKey=k; SM.setWeightShare(k,Number(v)); updateWeightUI(k); rescore(true); }
function onWeightChange(){ activeWeightKey=null; syncWeightSliders(); }
function updateWeightUI(skipKey){
  const W=SM.READINESS_WEIGHTS;
  for(const k of Object.keys(W)){
    const box=document.getElementById("weight-"+k); if(!box) continue;
    box.querySelector("b").textContent=Math.round(W[k]*100)+"%";
    if(k!==skipKey){ const inp=box.querySelector("input"); if(inp) inp.value=Math.round(W[k]*100); }
  }
}
function syncWeightSliders(){
  const W=SM.READINESS_WEIGHTS;
  for(const k of Object.keys(W)){
    const inp=document.querySelector("#weight-"+k+" input"); if(inp) inp.value=Math.round(W[k]*100);
  }
}
function resetWeights(){ SM.setWeights({creditworthiness:.30,fiscalHealth:.30,legalCapacity:.20,governance:.20}); renderAll(); }
function renderReadiness(skipWeights){
  const W=SM.READINESS_WEIGHTS;
  let rows=DATA.sngs.filter(s=>
    (filterCountry==="all"||s.country===filterCountry)&&(filterTier==="all"||s.tier===filterTier));
  rows.sort((a,b)=>{
    const av=sortKey==="name"||sortKey==="country"?a[sortKey]:(a[sortKey]??a.readiness[sortKey]);
    const bv=sortKey==="name"||sortKey==="country"?b[sortKey]:(b[sortKey]??b.readiness[sortKey]);
    return (av>bv?1:av<bv?-1:0)*sortDir;
  });
  const countries=["all",...[...new Set(DATA.sngs.map(s=>s.country))].sort()];
  const th=(k,l)=>`<th onclick="setSort('${k}')">${l}${sortKey===k?(sortDir<0?" ▾":" ▴"):""}</th>`;
  const sliders=Object.keys(W).map(k=>`
    <div class="w" id="weight-${k}"><label>${SM.PILLAR_LABELS[k]}<b>${Math.round(W[k]*100)}%</b></label>
    <input type="range" min="0" max="100" value="${Math.round(W[k]*100)}"
      oninput="onWeightInput('${k}',this.value)" onchange="onWeightChange()"/></div>`).join("");
  const body=rows.map(s=>{
    const prov=s.signals.capagRating?`<span class="badge real" title="Anchored to Brazil Treasury CAPAG open data">CAPAG ${s.signals.capagRating}</span>`:`<span class="badge" title="Mock value — wire CityCatalyst for live signals">mock</span>`;
    return `
    <tr onclick="openDrawer('${s.id}')">
      <td><b>${s.name}</b><div style="color:var(--muted);font-size:11px">${s.country} · ${s.type}</div></td>
      <td>${cellBar(s.readiness.creditworthiness)}</td>
      <td>${cellBar(s.readiness.fiscalHealth)}</td>
      <td>${cellBar(s.readiness.legalCapacity)}</td>
      <td>${cellBar(s.readiness.governance)}</td>
      <td><b style="font-size:15px;color:${tierColor(s.tier)}">${s.compositeReadiness}</b></td>
      <td><span class="pill" style="background:${tierColor(s.tier)}22;color:${tierColor(s.tier)}">${s.tier}</span></td>
      <td style="color:var(--muted)">${prov}</td>
    </tr>`;}).join("");
  const bodyHtml=`
    <div class="controls">
      <select onchange="filterCountry=this.value;renderReadiness(false)">${countries.map(c=>`<option value="${c}" ${c===filterCountry?"selected":""}>${c==="all"?"All countries":c}</option>`).join("")}</select>
      <select onchange="filterTier=this.value;renderReadiness(false)">
        ${["all","Ready","Developing","Early"].map(t=>`<option ${t===filterTier?"selected":""} value="${t}">${t==="all"?"All tiers":t}</option>`).join("")}
      </select>
      <div style="flex:1"></div>
      <div style="color:var(--muted);align-self:center;font-size:12px">${rows.length} of ${DATA.sngs.length} candidates</div>
    </div>
    <table><thead><tr>
      ${th("name","Candidate")}${th("creditworthiness","Credit")}${th("fiscalHealth","Fiscal")}
      ${th("legalCapacity","Legal")}${th("governance","Govern.")}${th("compositeReadiness","Score")}
      <th>Tier</th><th>Source</th>
    </tr></thead><tbody>${body}</tbody></table>`;
  if(skipWeights){
    const el=document.getElementById("tab-readiness-body");
    if(el) el.innerHTML=bodyHtml;
    return;
  }
  document.getElementById("tab-readiness").innerHTML=`
    <div class="section-title">Early creditworthiness assessment</div>
    <p class="section-sub">The SFP eligibility test (§4.2): <i>credit strength, financial viability, legal capacity and good governance</i>,
    scored 0–100 per pillar and weighted into a composite. Drag a weight and every score in the app — pipeline, KPIs, M&amp;E —
    re-computes live from <code>scoring.js</code>. Click a row for the full assessment and the project-eligibility gate.</p>
    <div class="weights">${sliders}
      <button class="btn ghost" onclick="resetWeights()">Reset weights</button>
      <div style="color:var(--muted);font-size:11.5px">weights renormalize to 100%</div>
    </div>
    <div id="tab-readiness-body">${bodyHtml}</div>`;
}
function cellBar(v){return `<div style="display:flex;align-items:center;gap:7px"><div class="bar"><i style="width:${v}%;background:${barColor(v)}"></i></div><span style="font-size:11px;color:var(--muted)">${v}</span></div>`;}
function setSort(k){ if(sortKey===k)sortDir*=-1; else {sortKey=k;sortDir=-1;} renderReadiness(false); }

/* ---------- M&E + Board (OVE evaluation spine) ---------- */
// map the pilot indicators onto the SFP vertical logic (Annex IV)
const RESULTS_MATRIX=[
  {title:"Specific objective 1 — strengthen SNGs' fiscal & financial management",
   desc:"Early-outcome family: financing conditions, fiscal transparency, local autonomy (Annex IV fig. 1).",
   names:["SNGs creditworthy w/o sovereign guarantee","SNGs w/ independent audit","Avg readiness score (pipeline)"]},
  {title:"Specific objective 2 — strengthen capacity to structure & implement project pipelines",
   desc:"Early-outcome family: investment project management, regulatory compliance, risk management.",
   names:["SNGs screened for readiness","SNGs passing readiness (Ready tier)","Projects in structuring/Board pipeline"]},
  {title:"Specific objective 3 — improve service delivery & infrastructure at subnational level",
   desc:"Early-outcome family: investment via sub-sovereign finance, access, private-sector participation.",
   names:["Indicative financing committed","Countries with active pipeline"]},
];
function gapText(i){
  if(i.status==="on-track")return "";
  const gap=Math.round((i.target-i.current)*10)/10;
  if(gap<=0)return "";
  const what=i.unit==="$M"?`$${gap}M more`:i.unit==="pts"?`${gap} pts more`:`${gap} more`;
  return `<div class="gap">needs ${what} before ${i.milestone}</div>`;
}
function meCard(i){
  const pct=Math.min(100,Math.round(i.current/i.target*100));
  return `<div class="me-card">
    <div class="top"><div class="name">${i.name}</div><div class="status s-${i.status}">${i.status.replace("-"," ")}</div></div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px">
      <div class="nums"><b>${i.current}</b> / ${i.target} ${i.unit}</div></div>
    <div class="bar" style="margin-top:8px"><i style="width:${pct}%;background:${i.status==='on-track'?'var(--green)':i.status==='at-risk'?'var(--amber)':'var(--red)'}"></i></div>
    ${gapText(i)}
    <div class="ms">▸ reports to: ${i.milestone}</div>
  </div>`;
}
function renderME(){
  const tl=DATA.boardMilestones.map(m=>`
    <div class="ms-node ${new Date(m.date)<TODAY?"past":""}"><div class="pt"></div>
      <div class="d">${m.date}</div><div class="ti">${m.title}</div><div class="ds">${m.desc}</div></div>`).join("");
  // subprograms (proposal §1.3): SP1 US$1B OC investment finance; SP2 ~US$13M TC readiness
  const committed=askSum(DATA.sngs.filter(x=>x.proposal.stage==="Board Pipeline"));
  const structuring=askSum(DATA.sngs.filter(x=>x.proposal.stage==="Structuring"));
  const sp1pct=Math.min(100,committed/1000*100);
  // portfolio risk: country concentration of active pipeline (Structuring + Board)
  const active=DATA.sngs.filter(x=>["Structuring","Board Pipeline"].includes(x.proposal.stage));
  const byCountry={}; active.forEach(s=>byCountry[s.country]=(byCountry[s.country]||0)+s.proposal.askUSDm);
  const tot=askSum(active)||1;
  const conc=Object.entries(byCountry).sort((a,b)=>b[1]-a[1]);
  const topShare=conc.length?Math.round(conc[0][1]/tot*100):0;
  const concBars=conc.map(([c,v])=>`<div class="hbar"><div class="lab">${c}</div>
    <div class="bar" style="flex:1"><i style="width:${Math.round(v/tot*100)}%;background:${v/tot>0.3?"var(--amber)":"var(--cyan)"}"></i></div>
    <div class="val">$${v.toFixed(0)}M · ${Math.round(v/tot*100)}%</div></div>`).join("");
  const noG=active.filter(s=>s.signals.canBorrowWithoutSovereignGuarantee).length;
  const matrix=RESULTS_MATRIX.map(g=>{
    const cards=g.names.map(n=>DATA.meIndicators.find(i=>i.name===n)).filter(Boolean).map(meCard).join("");
    return `<div class="obj"><div class="ot">${g.title}</div><div class="od">${g.desc}</div></div>
      <div class="me-grid">${cards}</div>`;
  }).join("");
  document.getElementById("tab-me").innerHTML=`
    <div class="section-title">Board reporting timeline</div>
    <p class="section-sub">The pilot must prove itself to the Board: a mid-term report in year 3, then OVE evaluates the SFP
    as a lending instrument after year 5 (8–10 projects expected), informing extension or mainstreaming.</p>
    <div class="timeline">${tl}</div>
    <div class="evalnote">··· then Year-5: OVE evaluation of the SFP as a lending instrument → Board decides continuation / mainstreaming</div>
    <div class="twocol">
      <div class="panelcard"><h4>Subprogram 1 — Investment finance (Ordinary Capital)</h4>
        <div class="hint">Up to US$1,000M for loans &amp; guarantees to eligible SNGs, no sovereign guarantee. Live from the pipeline:</div>
        <div class="hbar"><div class="lab">Indicative committed</div><div class="bar" style="flex:1"><i style="width:${sp1pct}%;background:var(--cyan)"></i></div><div class="val">$${committed.toFixed(0)}M</div></div>
        <div class="hbar"><div class="lab">In structuring</div><div class="bar" style="flex:1"><i style="width:${Math.min(100,structuring/1000*100)}%;background:var(--cyan-b)"></i></div><div class="val">$${structuring.toFixed(0)}M</div></div>
        <div class="hint" style="margin-top:8px">${(sp1pct).toFixed(1)}% of the US$1B envelope at Board stage.</div>
      </div>
      <div class="panelcard"><h4>Subprogram 2 — TC "sub-sovereign readiness" (~US$13M)</h4>
        <div class="hint">Technical cooperation that gets candidates ready (mock utilization):</div>
        <div class="hbar"><div class="lab">Regular TC · reforms &amp; prefeasibility</div><div class="bar" style="flex:1"><i style="width:46%;background:var(--cyan)"></i></div><div class="val">of $4M</div></div>
        <div class="hbar"><div class="lab">Contingent-recovery TC · project design</div><div class="bar" style="flex:1"><i style="width:31%;background:var(--cyan-b)"></i></div><div class="val">of $6M</div></div>
        <div class="hbar"><div class="lab">Pilot implementation + M&amp;E</div><div class="bar" style="flex:1"><i style="width:38%;background:var(--cyan-d)"></i></div><div class="val">of $3M</div></div>
      </div>
    </div>
    <div class="twocol">
      <div class="panelcard"><h4>Portfolio risk — country concentration (active pipeline)</h4>
        <div class="hint">Share of $ ask in Structuring + Board Pipeline. ${topShare>30?`<b style="color:#9A6B14">Top country holds ${topShare}% — concentration watch.</b>`:"No single-country concentration above 30%."}</div>
        ${concBars}
      </div>
      <div class="panelcard"><h4>Risk posture (proposal §1.6)</h4>
        <div class="hint">Mitigation = deliberate selection of creditworthy borrowers + fiscal-responsibility frameworks + regular monitoring of financial indicators.</div>
        <div class="hbar"><div class="lab">Active pipeline able to borrow w/o guarantee</div><div class="bar" style="flex:1"><i style="width:${Math.round(noG/(active.length||1)*100)}%;background:var(--green)"></i></div><div class="val">${noG}/${active.length}</div></div>
        <div class="hbar"><div class="lab">Active pipeline in Ready tier</div><div class="bar" style="flex:1"><i style="width:${Math.round(active.filter(s=>s.tier==="Ready").length/(active.length||1)*100)}%;background:var(--green)"></i></div><div class="val">${active.filter(s=>s.tier==="Ready").length}/${active.length}</div></div>
        <div class="hbar"><div class="lab">Active pipeline with independent audit</div><div class="bar" style="flex:1"><i style="width:${Math.round(active.filter(s=>s.signals.independentAudit).length/(active.length||1)*100)}%;background:var(--green)"></i></div><div class="val">${active.filter(s=>s.signals.independentAudit).length}/${active.length}</div></div>
      </div>
    </div>
    <div class="section-title" style="margin-top:8px">Results matrix — pilot indicators vs. targets (Annex IV vertical logic)</div>
    ${matrix}`;
}

/* ---------- Drawer (one candidate record · two lenses) ---------- */
function openDrawer(id){
  const s=DATA.sngs.find(x=>x.id===id); if(!s)return;
  const yn=b=>b?'<span class="ok">✓ yes</span>':'<span class="no">✗ no</span>';
  const e=s.eligibility;
  const expl=SM.explainScore(s.readiness);
  const subs=expl.map(x=>`<div class="subrow"><div class="lab">${x.label}</div>
    <div class="bar" style="flex:1"><i style="width:${x.score}%;background:${barColor(x.score)}"></i></div>
    <div class="pts">${x.score} × ${Math.round(x.weight*100)}% = <b>${x.points}</b></div></div>`).join("");
  const cl=SM.intakeChecklist(s);
  const checks=cl.map(c=>`<div class="check">${c.done?'<span class="ok">✓</span>':'<span class="no">✗</span>'}<span>${c.label}</span></div>`).join("");
  const stageIdx=STAGES.indexOf(s.proposal.stage);
  const strip=STAGES.map((st,i)=>`<div class="st ${i<stageIdx?"done":i===stageIdx?"cur":""}">${st}</div>`).join("");
  const prov=s.signals.capagRating?'<span class="badge real">CAPAG open data</span>':'<span class="badge">mock signals</span>';
  document.getElementById("drawer").innerHTML=`
    <div class="x" onclick="closeDrawer()">✕</div>
    <h2>${s.name}</h2>
    <div style="color:var(--muted);font-size:12.5px">${s.country} · ${s.type} · pop. ${fmt(s.population)} · ${s.id}</div>

    <div class="sechead">Early creditworthiness assessment ${prov}</div>
    <div class="scorewheel">
      <div class="big" style="color:${tierColor(s.tier)}">${s.compositeReadiness}</div>
      <div><span class="pill" style="background:${tierColor(s.tier)}22;color:${tierColor(s.tier)};font-size:13px">${s.tier}</span>
      <div style="color:var(--muted);font-size:11.5px;margin-top:5px">Composite readiness · pillar score × weight = points</div></div>
    </div>
    ${subs}
    <div class="kv" style="margin-top:12px">
      <div><div class="k">CAPAG rating</div><div class="val">${s.signals.capagRating||"n/a"}</div></div>
      <div><div class="k">Own-source revenue</div><div class="val">${fv(s.signals.ownSourceRevenuePct,"%")}</div></div>
      <div><div class="k">Debt service ratio</div><div class="val">${fv(s.signals.debtServiceRatioPct,"%")}</div></div>
      <div><div class="k">Operating balance</div><div class="val">${fv(s.signals.currentBalancePct,"%")}</div></div>
    </div>
    <div class="elig" style="margin-top:14px">
      <div class="k" style="color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-size:11px">IDB eligibility gate — 3 simultaneous project criteria + SNG conditions</div>
      <div>High developmental impact ${yn(e.highDevImpact)}</div>
      <div>No private-sector crowding-out ${yn(e.noCrowdingOut)}</div>
      <div>Improves SNG efficiency &amp; effectiveness ${yn(e.improvesSNGEfficiency)}</div>
      <div>SNG / central gov not in non-accrual ${yn(e.centralGovNotInNonAccrual)}</div>
      <div>Can borrow without sovereign guarantee ${yn(s.signals.canBorrowWithoutSovereignGuarantee)}</div>
      <div style="margin-top:8px;font-weight:700">Overall: ${e.eligible?'<span class="ok">Eligible to advance</span>':'<span class="no">Not yet eligible</span>'}</div>
    </div>

    <div class="sechead">Proposal &amp; process</div>
    <div class="kv">
      <div><div class="k">Proposal</div><div class="val">${s.proposal.title}</div></div>
      <div><div class="k">Ask</div><div class="val">$${s.proposal.askUSDm}M ${s.proposal.cofinance?'<span class="badge good" style="background:#E2F2E9;color:#2A7A4F">cofinance</span>':""}</div></div>
      <div><div class="k">Submitted</div><div class="val">${s.proposal.submitted} · ${daysIn(s)}d ago</div></div>
      <div><div class="k">Current stage</div><div class="val">${s.proposal.stage}</div></div>
    </div>
    <div class="procstrip">${strip}</div>
    <div style="color:var(--muted);font-size:11px;margin-bottom:10px">Next gate: ${STAGE_META[STAGES[Math.min(stageIdx+1,STAGES.length-1)]]}</div>
    <div class="k" style="color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-size:11px;margin-top:6px">Documentary intake checklist</div>
    ${checks}

    <div class="footnote">Readiness signals would be fed live from <b>CityCatalyst</b> (OpenEarth) + open fiscal data
    (e.g. Brazil Treasury CAPAG). Sub-scores marked "mock" are fictional demo values. Scoring weights &amp; thresholds
    are transparent in <code>scoring.js</code> and tunable from the Readiness Scoring tab.</div>`;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerBg").style.display="block";
}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("drawerBg").style.display="none";}

/* ---------- New proposal intake form ---------- */
function openIntakeForm(){
  const countries=Object.keys(ISO);
  const slider=(k,l)=>`<label class="full">${l}
    <span class="rrow"><input type="range" min="0" max="100" value="50" id="f_${k}" oninput="this.nextElementSibling.value=this.value"/><output>50</output></span></label>`;
  document.getElementById("modal").innerHTML=`
    <h3>New proposal — documentary intake</h3>
    <div class="hint">Creates a candidate card in <b>Intake</b>, scored immediately by the live model. In production the readiness
    inputs come from a CityCatalyst lookup; here they are manual sliders.</div>
    <div class="fgrid">
      <label>SNG name<input type="text" id="f_name" placeholder="e.g. Santa Marta"/></label>
      <label>Country<select id="f_country">${countries.map(c=>`<option>${c}</option>`).join("")}</select></label>
      <label>Type<select id="f_type"><option>City</option><option>Region</option></select></label>
      <label>Population<input type="number" id="f_pop" value="500000" min="1000"/></label>
      <label class="full">Project title / sector<input type="text" id="f_title" placeholder="e.g. Water & sanitation"/></label>
      <label>Ask (US$M)<input type="number" id="f_ask" value="25" min="0.5" step="0.5"/></label>
      <label class="checklabel" style="align-self:end;flex-direction:row"><input type="checkbox" id="f_cof"/>private cofinance expected</label>
      ${slider("credit","Creditworthiness (0–100)")}
      ${slider("fiscal","Fiscal health (0–100)")}
      ${slider("legal","Legal capacity (0–100)")}
      ${slider("gov","Governance (0–100)")}
      <label class="checklabel" style="flex-direction:row"><input type="checkbox" id="f_audit"/>independent audit on file</label>
      <label class="checklabel" style="flex-direction:row"><input type="checkbox" id="f_nosg"/>can borrow w/o sovereign guarantee</label>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitIntake()">Create &amp; score</button>
    </div>`;
  document.getElementById("modalBg").style.display="flex";
}
function closeModal(){document.getElementById("modalBg").style.display="none";}
function submitIntake(){
  const g=id=>document.getElementById(id);
  const name=g("f_name").value.trim(); if(!name){g("f_name").focus();return;}
  const country=g("f_country").value;
  const maxId=Math.max(...DATA.sngs.map(s=>parseInt(s.id.split("-")[1],10)));
  const sng=SM.scoreSNG({
    id:"SNG-"+(maxId+1), name, country, iso:ISO[country]||"??",
    type:g("f_type").value, population:Number(g("f_pop").value)||0,
    proposal:{ title:g("f_title").value.trim()||"Untitled project", askUSDm:Number(g("f_ask").value)||0,
      stage:"Intake", submitted:DATA.generated, cofinance:g("f_cof").checked },
    readiness:{ creditworthiness:Number(g("f_credit").value), fiscalHealth:Number(g("f_fiscal").value),
      legalCapacity:Number(g("f_legal").value), governance:Number(g("f_gov").value) },
    signals:{ capagRating:null, ownSourceRevenuePct:null, debtServiceRatioPct:null, currentBalancePct:null,
      independentAudit:g("f_audit").checked, canBorrowWithoutSovereignGuarantee:g("f_nosg").checked },
  });
  DATA.sngs.unshift(sng);
  closeModal(); renderAll(); openDrawer(sng.id);
}

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  ["pipeline","readiness","me"].forEach(t=>document.getElementById("tab-"+t).style.display="none");
  document.getElementById("tab-"+b.dataset.tab).style.display="block";
});

renderAll();
</script>
</body>
</html>
