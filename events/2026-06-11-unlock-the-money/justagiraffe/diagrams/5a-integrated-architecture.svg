<title>Revised 5a integrated architecture</title>
<desc>CityCatalyst as host infrastructure; Project Preparator and City Readiness Navigator as peer modules; the Navigator is a three-step vertical (entity creditworthiness, readiness pathways/coaching, portfolio and pooling); capacity building is a standalone support track; funder pipelines at the bottom.</desc>
